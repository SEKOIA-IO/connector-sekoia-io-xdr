[project]
name = "connector-sekoia-io-xdr"
version = "2.0.0"
description = "Development environment for the SEKOIA.IO XDR connector"
readme = "README.md"
requires-python = ">=3.9,<3.15"
dependencies = [
    "pydantic>=2.11.7",
    "requests>=2.32.5",
    "requests-toolbelt>=1.0.0",
    "tenacity>=9.1.2",
    "urllib3>=2.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django>=4.2,<5",
    "libcst>=1.8.2",
    "pytest>=8.4.2",
]
lint = [
    "black>=25.11.0",
    "isort>=6.1.0",
    "mypy>=1.19.1",
    "ruff>=0.15.20",
]

# Run mypy on connector source and tests while excluding local/generated folders.
[tool.mypy]
python_version = "3.10"
files = ["sekoia_io_xdr", "tests"]
exclude = "(^|/)\\.venv/|(^|/)\\.pytest_cache/|(^|/)\\.tmp/"
ignore_missing_imports = true
follow_imports = "skip"
show_column_numbers = true

[tool.black]
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff.lint]
select = ["F401"]
