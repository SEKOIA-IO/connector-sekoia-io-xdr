[project]
name = "connector-sekoia-io-xdr"
version = "2.0.0"
description = "Development environment for the SEKOIA.IO XDR connector"
readme = "README.md"
requires-python = ">=3.9,<3.15"
dependencies = [
    "requests>=2.32.5",
    "requests-toolbelt>=1.0.0",
    "tenacity>=9.1.2",
    "urllib3>=2.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django>=4.2,<5",
    "pytest>=8.4.2",
]
