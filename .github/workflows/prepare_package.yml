name: Connector Sekoia XDR Package Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality_gate:
    name: "prepare_package / quality-gate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --group dev --group lint

      - name: Run quality gate checks
        run: |
          uv run python -m scripts.sync_requirements_txt --check
          uv run mypy -p sekoia_io_xdr
          uv run mypy tests
          uv run mypy scripts
          uv run ruff check connector.py health_check.py sekoia_io_xdr tests scripts
          uv run black --check connector.py health_check.py sekoia_io_xdr tests scripts
          uv run isort --check-only connector.py health_check.py sekoia_io_xdr tests scripts
          uv run python -m scripts.sort_info_json --check
          uv run python -m scripts.normalize_deprecated_parameters --check
          uv run python -m scripts.sort_operation_payload_keys --check
          uv run --with pytest-cov \
            pytest tests/ --color=yes -vv \
            --cov=sekoia_io_xdr \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-fail-under=100

  build_archive:
    name: "prepare_package / build-archive"
    runs-on: ubuntu-latest
    needs: quality_gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --group dev --group lint

      - name: Build connector archive
        run: uv run python -m scripts.build_connector_archives

      - name: Upload connector archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: sekoia-io-xdr-archives
          path: |
            dist/*.tgz
            dist/*.zip
          if-no-files-found: error

      - name: Print artifact download hint
        run: |
          echo "Connector archives uploaded as GitHub artifact: sekoia-io-xdr-archives"
          echo "Download it from this workflow run page:"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
