name: Connector Sekoia XDR Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # Run each lint check in parallel using a matrix.
  lint:
    name: "lint / ${{ matrix.check }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry defines one independent lint command.
        include:
          - check: black
            command: uv run black --check sekoia-io-xdr tests scripts
            fix_command: uv run black sekoia-io-xdr tests scripts
          - check: isort
            command: uv run isort --check-only sekoia-io-xdr tests scripts
            fix_command: uv run isort sekoia-io-xdr tests scripts
          - check: mypy
            command: MYPYPATH=sekoia-io-xdr uv run mypy -p sekoia_io_xdr && MYPYPATH=sekoia-io-xdr uv run mypy tests && uv run mypy scripts
            fix_command: MYPYPATH=sekoia-io-xdr uv run mypy -p sekoia_io_xdr && MYPYPATH=sekoia-io-xdr uv run mypy tests && uv run mypy scripts
          - check: ruff
            command: uv run ruff check sekoia-io-xdr tests scripts
            fix_command: uv run ruff check sekoia-io-xdr tests scripts --fix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      # Install both development and lint toolchains.
      - name: Sync dependencies
        run: uv sync --group dev --group lint

      # Execute only the command for the current matrix entry.
      - name: Run lint check
        run: |
          if ! ${{ matrix.command }}; then
            printf '\033[1;31mPlease run this command locally to fix the errors above:\033[0m\n\n%s\n' "${{ matrix.fix_command }}"
            exit 1
          fi
