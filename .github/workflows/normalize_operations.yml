name: Connector Sekoia XDR Normalize Operations Checks

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  normalize_operations:
    name: "normalize_operations / payload-key-sort"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --group dev --group lint

      - name: Run normalize operations check (read-only)
        run: |
          if ! uv run python -m scripts.sort_operation_payload_keys --check; then
            printf '\033[1;31mPlease run this command locally to fix the errors above:\033[0m\n\n%s\n' "uv run python -m scripts.sort_operation_payload_keys"
            exit 1
          fi
